# ─────────────────────────────────────────────────────────────────────────────
# ICC 2026 — data transaction & event patterns demo stack
#
#   python tasks.py seed     first run only, see docs/00-architecture.md § Seeding
#   python tasks.py up
#
# No compose profiles. The whole stack runs all the time — during the talk you
# move between patterns live, and a forgotten --profile flag is a failure mode
# nobody needs on stage. Iterate on one service with:
#   docker compose up -d <service>  /  docker compose restart <service>
#
# The MQTT Distributor fallback is an Ignition *module*, not a container, so it
# is toggled inside the gateway rather than here.
# ─────────────────────────────────────────────────────────────────────────────

name: ${COMPOSE_PROJECT_NAME:-icc26}

services:

  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL — Ignition's SQL connection target, demo data, and the CDC source
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: icc26-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      TZ: ${TZ:-America/Chicago}
    # wal_level=logical is required for pattern 5 (CDC). It is a server start
    # parameter, so getting it wrong later means dropping the data volume — which
    # is exactly why it is set on day one rather than when pattern 5 is built.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - wal_sender_timeout=0
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume only.
      - ./compose/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Chariot MQTT Server — the event backbone
  #
  # Standalone on purpose. The talk's thesis is "seven mechanisms, one backbone";
  # if the broker lived inside Ignition then Ignition would be both the backbone
  # and half the clients, and restarting it would take the demo down with it.
  # ───────────────────────────────────────────────────────────────────────────
  chariot:
    image: cirruslink/chariot:${CHARIOT_VERSION:-latest}
    container_name: icc26-chariot
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "true"
      ADMIN_PASSWORD: ${CHARIOT_ADMIN_PASSWORD:-password}
      # Applied on first run only — Chariot persists users into its own store.
      # See compose/chariot/README.md.
      MQTT_USERS: /config/mqtt-users.json
      # allowAnonymous is true *for now*, deliberately and temporarily. The six
      # ACL'd accounts above still get seeded on first run and still work; this
      # only means a client may also connect without credentials. It buys the
      # team a rollout where nobody debugs a silent ACL rejection while writing
      # their first pattern service.
      #
      # Turning it back off before the talk is this one boolean plus
      # `python tasks.py restart chariot` -- SERVER_CONFIG is read at container
      # start. Deleting the users instead would NOT have been reversible that
      # cheaply: MQTT_USERS applies on first run only, so re-adding them later
      # would mean a `nuke` or hand-building six ACLs in the Chariot UI.
      # See compose/chariot/README.md.
      SERVER_CONFIG: >-
        {"port":1883,
         "securePort":8883,
         "enableNonSecure":true,
         "enableSecure":true,
         "allowAnonymous":true,
         "bindAddress":"0.0.0.0",
         "webSocketEnable":true,
         "webSocketPort":8090}
      TZ: ${TZ:-America/Chicago}
    volumes:
      - chariot-config:/config
      - ./compose/chariot/mqtt-users.json:/config/mqtt-users.json:ro
    ports:
      - "${CHARIOT_MQTT_PORT:-1883}:1883"      # MQTT
      - "${CHARIOT_MQTTS_PORT:-18883}:8883"    # MQTT over TLS (host side moved, see .env.example)
      - "${CHARIOT_WS_PORT:-8090}:8090"        # MQTT over WebSocket — the firehose view
      - "${CHARIOT_HTTP_PORT:-8081}:8080"      # web UI + REST
      - "${CHARIOT_HTTPS_PORT:-8444}:8443"
    # The web port answering proves nothing about the broker -- Chariot serves
    # its UI happily while the MQTT listener stays shut for want of a trial.
    # This is a liveness check only; `tasks.py health` checks the listener.
    healthcheck:
      # No -f on purpose. The root path answers 2xx today, but it is an
      # authenticated UI and a 401 is still a perfectly alive Chariot. Without
      # -f, curl fails only when nothing is listening -- which is the question.
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Ignition 8.3 gateway
  #
  # data/config and data/projects are bind-mounted from this repo — that is the
  # whole config-as-code story. Everything else under data/ is runtime state
  # living in the named volume and is gitignored.
  #
  # This service will NOT come up correctly against a fresh ign-data volume.
  # Run `python tasks.py seed` first. See docs/00-architecture.md § Seeding.
  # ───────────────────────────────────────────────────────────────────────────
  ignition:
    build:
      context: ./compose/ignition
      args:
        IGNITION_VERSION: ${IGNITION_VERSION:-8.3.8}
    image: icc26/ignition:${IGNITION_VERSION:-8.3.8}
    container_name: icc26-ignition
    # Pinned because the 8.3 entrypoint derives the gateway's default system name
    # from the hostname. Left to Docker it is the container ID, which lands in
    # committed config and changes on every rebuild -- a permanent diff for
    # everyone. Matches "systemName" in
    # ignition/config/resources/core/ignition/system-properties/config.json.
    hostname: icc26-ignition
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      IGNITION_EDITION: ${IGNITION_EDITION:-standard}
      GATEWAY_ADMIN_USERNAME: ${IGNITION_ADMIN_USERNAME:-admin}
      GATEWAY_ADMIN_PASSWORD: ${IGNITION_ADMIN_PASSWORD:-password}
      # NB: GATEWAY_MODULE_RELINK and the /modules bind-mount convention are
      # 8.1-era. The 8.3 entrypoint handles neither. See the volumes below.
      IGNITION_UID: ${IGNITION_UID:-2003}
      IGNITION_GID: ${IGNITION_GID:-2003}
      TZ: ${TZ:-America/Chicago}
      # Available inside the container. Committed Cirrus/OPC config currently uses
      # Embedded ciphertext, not env references — Ignition 8.3.8 has no env Secret
      # Provider (see docs/00-architecture.md). Kept so ICC26_DB_PASSWORD is ready
      # for the JDBC datasource and for a possible future provider. Deliberately
      # absent from the seed compose file: that pass runs vanilla config.
      # Changing one needs a container restart -- `tasks.py scan` will not do it.
      MQTT_ENGINE_PASSWORD: ${MQTT_ENGINE_PASSWORD:-ign-engine}
      MQTT_TRANSMISSION_PASSWORD: ${MQTT_TRANSMISSION_PASSWORD:-ign-transmission}
      MQTT_DISTRIBUTOR_PASSWORD: ${MQTT_DISTRIBUTOR_PASSWORD:-password}
      ICC26_DB_PASSWORD: ${ICC26_DB_PASSWORD:-icc26}
    volumes:
      - ign-data:/usr/local/bin/ignition/data
      # ── config as code ──
      - ./ignition/config:/usr/local/bin/ignition/data/config
      - ./ignition/projects:/usr/local/bin/ignition/data/projects
      # NOTE: the Cirrus modules are NOT mounted. They are baked into the image
      # (compose/ignition/Dockerfile) because bind-mounting into a subpath of
      # the data volume stops Docker seeding data/config and data/projects.
    ports:
      # Bootstrap/maintenance HTTP is host-local only. Conference-network
      # clients must use HTTPS; seed installs its certificate automatically.
      - "127.0.0.1:${IGNITION_HTTP_PORT:-8088}:8088"
      - "${IGNITION_HTTPS_PORT:-8043}:8043"
    # CAVEAT: /StatusPing reports {"state":"RUNNING"} while the gateway is parked
    # in commissioning serving only the setup wizard -- healthy here does NOT mean
    # commissioned. `tasks.py health` makes that distinction; this only catches a
    # gateway that is down or wedged.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/StatusPing || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    stop_grace_period: 45s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Pattern 3 — a simulated Countess 3 FL cell counter, served over OPC UA
  #
  # Address space built from Appendix E of the instrument's user guide; the
  # model is specified in docs/reference/countess-3fl-opcua-model.md and the
  # deviations are listed in services/opcua-countess/README.md.
  #
  # Ignition subscribes to ONE node — CountCompletedCounter, written last after
  # every result field — and reads the LastResult branch when it changes. That
  # is the pattern: event-on-completion, not value-change polling.
  #
  # Runs alongside opcua-novaflex, not instead of it. The Countess has no vendor
  # OPC server, so this address space is the one we would design; the FLEX2 has
  # a real one, so that address space is the one a vendor actually ships. The
  # pair is the pattern-3 argument — see docs/plans/03-opcua-analyzer-playbook.md.
  # ───────────────────────────────────────────────────────────────────────────
  opcua-countess:
    build: ./services/opcua-countess
    container_name: icc26-opcua-countess
    restart: unless-stopped
    environment:
      # Cube 2 stays empty on purpose: it puts a Bad_NoData node beside a Good
      # one inside the same result, which is the argument for modelling this in
      # OPC UA rather than shipping the CSV. See the model doc, section 8.
      CUBE1_INSTALLED: ${COUNTESS_CUBE1_INSTALLED:-true}
      CUBE2_INSTALLED: ${COUNTESS_CUBE2_INSTALLED:-false}
      COUNT_INTERVAL_S: ${COUNTESS_COUNT_INTERVAL_S:-180}
      FIRST_COUNT_DELAY_S: ${COUNTESS_FIRST_COUNT_DELAY_S:-15}
      BF_ONLY_EVERY_N: ${COUNTESS_BF_ONLY_EVERY_N:-4}
      LOG_LEVEL: ${COUNTESS_LOG_LEVEL:-INFO}
      # INFO here logs every node a client creates a monitored item for. That is the only
      # reliable way to tell whether an Ignition tag actually bound: a faulted OPC tag is
      # Error_Configuration in the tag browser and SILENT in the gateway log, so the server
      # is the oracle, not the gateway. Noisy — leave it at WARNING unless diagnosing.
      ASYNCUA_LOG_LEVEL: ${COUNTESS_ASYNCUA_LOG_LEVEL:-WARNING}
      TZ: ${TZ:-America/Chicago}
    ports:
      - "${OPCUA_COUNTESS_PORT:-4840}:4840"
    # The endpoint answering is the whole liveness question for this service --
    # it holds no state and depends on nothing else in the stack.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 4840), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Pattern 3 — a simulated Nova Biomedical BioProfile FLEX2 bioanalyzer,
  # served over OPC UA
  #
  # The second half of pattern 3, and the reason there are two. The FLEX2 has a
  # REAL vendor OPC UA server, and this container reproduces the address space
  # its manual documents (LPN 60644B section 9) — two flat trees of string-id
  # tags, OPCSystemObjects and OPCSystemCommands, inherited from the OPC DA
  # server they grew out of.
  #
  # What that vendor server does NOT have is the whole point:
  #   * no completion counter, no events — SampleResults just changes
  #   * no methods at all — every action is a writable Boolean you set to 1
  # So ICC26Extensions/ is ours, is named so nobody mistakes it for Nova's, and
  # is where SampleCompleteCounter lives. Countess = the model we wish vendors
  # shipped; FLEX2 = what they actually ship. Both, side by side, is the talk.
  #
  # Model + provenance: docs/reference/novaflex2-opcua-model.md
  # Deviations:         services/opcua-novaflex/README.md
  # ───────────────────────────────────────────────────────────────────────────
  opcua-novaflex:
    build: ./services/opcua-novaflex
    container_name: icc26-opcua-novaflex
    restart: unless-stopped
    environment:
      ANALYZER_ID: ${NOVAFLEX_ANALYZER_ID:-FLEX2-01}
      # The osmometer stays unfitted on purpose: Osmo/Result then reads
      # Bad_NoData beside chemistry values that are Good, in the same result, at
      # the same timestamp — while the vendor's own ModuleInformation/Modules/
      # Osmo says False, Good. Absent vs zero, in the vendor's vocabulary.
      OSMO_INSTALLED: ${NOVAFLEX_OSMO_INSTALLED:-false}
      # Autosampler bank B likewise: ten RSM status tags at Bad_NoData.
      AUTOSAMPLER_BANK_B: ${NOVAFLEX_AUTOSAMPLER_BANK_B:-false}
      SAMPLE_INTERVAL_S: ${NOVAFLEX_SAMPLE_INTERVAL_S:-120}
      FIRST_SAMPLE_DELAY_S: ${NOVAFLEX_FIRST_SAMPLE_DELAY_S:-15}
      # Every Nth free-running cycle runs an onboard QC instead of a sample. QC
      # writes QCResults and increments QcCompleteCounter — never the sample
      # counter. That is the manual's own section 9 warning, live.
      QC_EVERY_N: ${NOVAFLEX_QC_EVERY_N:-6}
      SENSOR_ERROR_RATE: ${NOVAFLEX_SENSOR_ERROR_RATE:-0.0}
      # The arrow is what the manual prints inside the NodeId identifier itself
      # (§1.2.2). Whether a real FLEX2 uses it or a dot is unresolved — one env
      # var settles it without touching a field table. See the model doc § 11.
      NODE_SEPARATOR: ${NOVAFLEX_NODE_SEPARATOR:-->}
      LOG_LEVEL: ${NOVAFLEX_LOG_LEVEL:-INFO}
      # INFO here logs every node a client creates a monitored item for — the only reliable
      # way to tell whether an Ignition tag actually bound. Same trick as the Countess.
      ASYNCUA_LOG_LEVEL: ${NOVAFLEX_ASYNCUA_LOG_LEVEL:-WARNING}
      TZ: ${TZ:-America/Chicago}
    ports:
      # 4841 on the host, 4840 in the container: both analyzers run at once and
      # the host side would collide otherwise. Ignition reaches it by service
      # name on the compose network and never sees this number.
      - "${OPCUA_NOVAFLEX_PORT:-4841}:4840"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 4840), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Pattern 1 adds no service here. The vibration gateway is simulated inside
  # Ignition — a Gateway Timer Script for telemetry and an event stream for the
  # collect command, both publishing plain MQTT through Transmission. See
  # docs/plans/01-native-mqtt.md. (services/sim-vibration/ holds a standalone
  # container implementation of the same contract; it is NOT wired in.)
  #
  # Remaining pattern services land here in steps 4–8:
  #   lims             (patterns 4, 6, 7)  services/lims  — implementation TBD
  #   debezium         (pattern 5)  quay.io/debezium/server
  # ───────────────────────────────────────────────────────────────────────────

volumes:
  pgdata:
  ign-data:
  chariot-config:

networks:
  icc26:
    name: icc26
