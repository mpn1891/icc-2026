# ─────────────────────────────────────────────────────────────────────────────
# ICC 2026 — data transaction & event patterns demo stack
#
#   python tasks.py seed     first run only, see docs/00-architecture.md § Seeding
#   python tasks.py up
#
# No compose profiles. The whole stack runs all the time — during the talk you
# move between patterns live, and a forgotten --profile flag is a failure mode
# nobody needs on stage. Iterate on one service with:
#   docker compose up -d <service>  /  docker compose restart <service>
#
# The MQTT Distributor fallback is an Ignition *module*, not a container, so it
# is toggled inside the gateway rather than here.
# ─────────────────────────────────────────────────────────────────────────────

name: ${COMPOSE_PROJECT_NAME:-icc26}

services:

  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL — Ignition's SQL connection target, demo data, and the CDC source
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: icc26-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      TZ: ${TZ:-America/Chicago}
    # wal_level=logical is required for pattern 5 (CDC). It is a server start
    # parameter, so getting it wrong later means dropping the data volume — which
    # is exactly why it is set on day one rather than when pattern 5 is built.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - wal_sender_timeout=0
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume only.
      - ./compose/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Chariot MQTT Server — the event backbone
  #
  # Standalone on purpose. The talk's thesis is "seven mechanisms, one backbone";
  # if the broker lived inside Ignition then Ignition would be both the backbone
  # and half the clients, and restarting it would take the demo down with it.
  # ───────────────────────────────────────────────────────────────────────────
  chariot:
    image: cirruslink/chariot:${CHARIOT_VERSION:-latest}
    container_name: icc26-chariot
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "true"
      ADMIN_PASSWORD: ${CHARIOT_ADMIN_PASSWORD:-password}
      # Applied on first run only — Chariot persists users into its own store.
      # See compose/chariot/README.md.
      MQTT_USERS: /config/mqtt-users.json
      # allowAnonymous is true *for now*, deliberately and temporarily. The six
      # ACL'd accounts above still get seeded on first run and still work; this
      # only means a client may also connect without credentials. It buys the
      # team a rollout where nobody debugs a silent ACL rejection while writing
      # their first pattern service.
      #
      # Turning it back off before the talk is this one boolean plus
      # `python tasks.py restart chariot` -- SERVER_CONFIG is read at container
      # start. Deleting the users instead would NOT have been reversible that
      # cheaply: MQTT_USERS applies on first run only, so re-adding them later
      # would mean a `nuke` or hand-building six ACLs in the Chariot UI.
      # See compose/chariot/README.md.
      SERVER_CONFIG: >-
        {"port":1883,
         "securePort":8883,
         "enableNonSecure":true,
         "enableSecure":true,
         "allowAnonymous":true,
         "bindAddress":"0.0.0.0",
         "webSocketEnable":true,
         "webSocketPort":8090}
      TZ: ${TZ:-America/Chicago}
    volumes:
      - chariot-config:/config
      - ./compose/chariot/mqtt-users.json:/config/mqtt-users.json:ro
    ports:
      - "${CHARIOT_MQTT_PORT:-1883}:1883"      # MQTT
      - "${CHARIOT_MQTTS_PORT:-18883}:8883"    # MQTT over TLS (host side moved, see .env.example)
      - "${CHARIOT_WS_PORT:-8090}:8090"        # MQTT over WebSocket — the firehose view
      - "${CHARIOT_HTTP_PORT:-8081}:8080"      # web UI + REST
      - "${CHARIOT_HTTPS_PORT:-8444}:8443"
    # The web port answering proves nothing about the broker -- Chariot serves
    # its UI happily while the MQTT listener stays shut for want of a trial.
    # This is a liveness check only; `tasks.py health` checks the listener.
    healthcheck:
      # No -f on purpose. The root path answers 2xx today, but it is an
      # authenticated UI and a 401 is still a perfectly alive Chariot. Without
      # -f, curl fails only when nothing is listening -- which is the question.
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Ignition 8.3 gateway
  #
  # data/config and data/projects are bind-mounted from this repo — that is the
  # whole config-as-code story. Everything else under data/ is runtime state
  # living in the named volume and is gitignored.
  #
  # This service will NOT come up correctly against a fresh ign-data volume.
  # Run `python tasks.py seed` first. See docs/00-architecture.md § Seeding.
  # ───────────────────────────────────────────────────────────────────────────
  ignition:
    build:
      context: ./compose/ignition
      args:
        IGNITION_VERSION: ${IGNITION_VERSION:-8.3.8}
    image: icc26/ignition:${IGNITION_VERSION:-8.3.8}
    container_name: icc26-ignition
    # Pinned because the 8.3 entrypoint derives the gateway's default system name
    # from the hostname. Left to Docker it is the container ID, which lands in
    # committed config and changes on every rebuild -- a permanent diff for
    # everyone. Matches "systemName" in
    # ignition/config/resources/core/ignition/system-properties/config.json.
    hostname: icc26-ignition
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      IGNITION_EDITION: ${IGNITION_EDITION:-standard}
      GATEWAY_ADMIN_USERNAME: ${IGNITION_ADMIN_USERNAME:-admin}
      GATEWAY_ADMIN_PASSWORD: ${IGNITION_ADMIN_PASSWORD:-password}
      # NB: GATEWAY_MODULE_RELINK and the /modules bind-mount convention are
      # 8.1-era. The 8.3 entrypoint handles neither. See the volumes below.
      IGNITION_UID: ${IGNITION_UID:-2003}
      IGNITION_GID: ${IGNITION_GID:-2003}
      TZ: ${TZ:-America/Chicago}
      # Available inside the container. Committed Cirrus/OPC config currently uses
      # Embedded ciphertext, not env references — Ignition 8.3.8 has no env Secret
      # Provider (see docs/00-architecture.md). Kept so ICC26_DB_PASSWORD is ready
      # for the JDBC datasource and for a possible future provider. Deliberately
      # absent from the seed compose file: that pass runs vanilla config.
      # Changing one needs a container restart -- `tasks.py scan` will not do it.
      MQTT_ENGINE_PASSWORD: ${MQTT_ENGINE_PASSWORD:-ign-engine}
      MQTT_TRANSMISSION_PASSWORD: ${MQTT_TRANSMISSION_PASSWORD:-ign-transmission}
      MQTT_DISTRIBUTOR_PASSWORD: ${MQTT_DISTRIBUTOR_PASSWORD:-password}
      ICC26_DB_PASSWORD: ${ICC26_DB_PASSWORD:-icc26}
    volumes:
      - ign-data:/usr/local/bin/ignition/data
      # ── config as code ──
      - ./ignition/config:/usr/local/bin/ignition/data/config
      - ./ignition/projects:/usr/local/bin/ignition/data/projects
      # NOTE: the Cirrus modules are NOT mounted. They are baked into the image
      # (compose/ignition/Dockerfile) because bind-mounting into a subpath of
      # the data volume stops Docker seeding data/config and data/projects.
    ports:
      # Bootstrap/maintenance HTTP is host-local only. Conference-network
      # clients must use HTTPS; seed installs its certificate automatically.
      - "127.0.0.1:${IGNITION_HTTP_PORT:-8088}:8088"
      - "${IGNITION_HTTPS_PORT:-8043}:8043"
    # CAVEAT: /StatusPing reports {"state":"RUNNING"} while the gateway is parked
    # in commissioning serving only the setup wizard -- healthy here does NOT mean
    # commissioned. `tasks.py health` makes that distinction; this only catches a
    # gateway that is down or wedged.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/StatusPing || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    stop_grace_period: 45s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Pattern 3 — a simulated Countess 3 FL cell counter, served over OPC UA
  #
  # Address space built from Appendix E of the instrument's user guide; the
  # model is specified in docs/reference/countess-3fl-opcua-model.md and the
  # deviations are listed in services/opcua-countess/README.md.
  #
  # Ignition subscribes to ONE node — CountCompletedCounter, written last after
  # every result field — and reads the LastResult branch when it changes. That
  # is the pattern: event-on-completion, not value-change polling.
  #
  # Runs alongside opcua-novaflex, not instead of it. The Countess has no vendor
  # OPC server, so this address space is the one we would design; the FLEX2 has
  # a real one, so that address space is the one a vendor actually ships. The
  # pair is the pattern-3 argument — see docs/plans/03-opcua-analyzer-playbook.md.
  # ───────────────────────────────────────────────────────────────────────────
  opcua-countess:
    build: ./services/opcua-countess
    container_name: icc26-opcua-countess
    restart: unless-stopped
    environment:
      # Cube 2 stays empty on purpose: it puts a Bad_NoData node beside a Good
      # one inside the same result, which is the argument for modelling this in
      # OPC UA rather than shipping the CSV. See the model doc, section 8.
      CUBE1_INSTALLED: ${COUNTESS_CUBE1_INSTALLED:-true}
      CUBE2_INSTALLED: ${COUNTESS_CUBE2_INSTALLED:-false}
      COUNT_INTERVAL_S: ${COUNTESS_COUNT_INTERVAL_S:-180}
      FIRST_COUNT_DELAY_S: ${COUNTESS_FIRST_COUNT_DELAY_S:-15}
      BF_ONLY_EVERY_N: ${COUNTESS_BF_ONLY_EVERY_N:-4}
      LOG_LEVEL: ${COUNTESS_LOG_LEVEL:-INFO}
      # INFO here logs every node a client creates a monitored item for. That is the only
      # reliable way to tell whether an Ignition tag actually bound: a faulted OPC tag is
      # Error_Configuration in the tag browser and SILENT in the gateway log, so the server
      # is the oracle, not the gateway. Noisy — leave it at WARNING unless diagnosing.
      ASYNCUA_LOG_LEVEL: ${COUNTESS_ASYNCUA_LOG_LEVEL:-WARNING}
      TZ: ${TZ:-America/Chicago}
    ports:
      - "${OPCUA_COUNTESS_PORT:-4840}:4840"
    # The endpoint answering is the whole liveness question for this service --
    # it holds no state and depends on nothing else in the stack.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 4840), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Pattern 3 — a simulated Nova Biomedical BioProfile FLEX2 bioanalyzer,
  # served over OPC UA
  #
  # The second half of pattern 3, and the reason there are two. The FLEX2 has a
  # REAL vendor OPC UA server, and this container reproduces the address space
  # its manual documents (LPN 60644B section 9) — two flat trees of string-id
  # tags, OPCSystemObjects and OPCSystemCommands, inherited from the OPC DA
  # server they grew out of.
  #
  # What that vendor server does NOT have is the whole point:
  #   * no completion counter, no events — SampleResults just changes
  #   * no methods at all — every action is a writable Boolean you set to 1
  # So ICC26Extensions/ is ours, is named so nobody mistakes it for Nova's, and
  # is where SampleCompleteCounter lives. Countess = the model we wish vendors
  # shipped; FLEX2 = what they actually ship. Both, side by side, is the talk.
  #
  # Model + provenance: docs/reference/novaflex2-opcua-model.md
  # Deviations:         services/opcua-novaflex/README.md
  # ───────────────────────────────────────────────────────────────────────────
  opcua-novaflex:
    build: ./services/opcua-novaflex
    container_name: icc26-opcua-novaflex
    restart: unless-stopped
    environment:
      ANALYZER_ID: ${NOVAFLEX_ANALYZER_ID:-FLEX2-01}
      # The osmometer stays unfitted on purpose: Osmo/Result then reads
      # Bad_NoData beside chemistry values that are Good, in the same result, at
      # the same timestamp — while the vendor's own ModuleInformation/Modules/
      # Osmo says False, Good. Absent vs zero, in the vendor's vocabulary.
      OSMO_INSTALLED: ${NOVAFLEX_OSMO_INSTALLED:-false}
      # Autosampler bank B likewise: ten RSM status tags at Bad_NoData.
      AUTOSAMPLER_BANK_B: ${NOVAFLEX_AUTOSAMPLER_BANK_B:-false}
      # Both 0: the analyzer starts nothing on its own. Since 2026-08-26 the
      # sample id reaches this instrument by a person typing it on the
      # sample-login page below, and a free-running analyzer invents ids nobody
      # typed — every result it produced would park unmatched in the LIMS. Set
      # them non-zero to get the old self-driving behaviour back.
      SAMPLE_INTERVAL_S: ${NOVAFLEX_SAMPLE_INTERVAL_S:-0}
      FIRST_SAMPLE_DELAY_S: ${NOVAFLEX_FIRST_SAMPLE_DELAY_S:-0}
      HTTP_PORT: 8087
      # Every Nth free-running cycle runs an onboard QC instead of a sample. QC
      # writes QCResults and increments QcCompleteCounter — never the sample
      # counter. That is the manual's own section 9 warning, live.
      # QC rides on free-running cycles, so with the interval at 0 this never
      # fires by itself. The sample-login page has a Run QC button instead.
      QC_EVERY_N: ${NOVAFLEX_QC_EVERY_N:-6}
      SENSOR_ERROR_RATE: ${NOVAFLEX_SENSOR_ERROR_RATE:-0.0}
      # The arrow is what the manual prints inside the NodeId identifier itself
      # (§1.2.2). Whether a real FLEX2 uses it or a dot is unresolved — one env
      # var settles it without touching a field table. See the model doc § 11.
      NODE_SEPARATOR: ${NOVAFLEX_NODE_SEPARATOR:-->}
      LOG_LEVEL: ${NOVAFLEX_LOG_LEVEL:-INFO}
      # INFO here logs every node a client creates a monitored item for — the only reliable
      # way to tell whether an Ignition tag actually bound. Same trick as the Countess.
      ASYNCUA_LOG_LEVEL: ${NOVAFLEX_ASYNCUA_LOG_LEVEL:-WARNING}
      TZ: ${TZ:-America/Chicago}
    ports:
      # 4841 on the host, 4840 in the container: both analyzers run at once and
      # the host side would collide otherwise. Ignition reaches it by service
      # name on the compose network and never sees this number.
      - "${OPCUA_NOVAFLEX_PORT:-4841}:4840"
      # The instrument's own sample-login touchscreen, in the same spirit as the
      # two valve pages on 8085/8086. This is where the valve's sample id gets
      # transcribed into the analyzer.
      - "${NOVAFLEX_HTTP_PORT:-8087}:8087"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 4840), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Pattern 1 — smart sample valve assembly, plain MQTT 3.1.1
  #
  # A sanitary sample valve with an RFID badge reader on BR-201's sample port.
  # Badge in, the valve strokes open for a sampling window, the valve closes;
  # every scan is published, granted or denied.
  #
  # Its twin below is the SAME assembly with Sparkplug B firmware, and the pair
  # is the argument. valve.py and webui.py are byte-for-byte identical in both
  # build contexts, so everything that differs between these two containers is a
  # difference the protocol caused rather than the device.
  #
  # The container serves the device's own commissioning page on 8085. Three
  # fields — topic, QoS, retained — and all three are somebody's opinion. Open it
  # next to 8086 and read the two pages side by side; that comparison is as much
  # of pattern 1 as the MQTT traffic is.
  #
  # Publish-only. There is no command topic and nothing on the backbone can open
  # this valve: authorization is decided against a local badge roster, because a
  # sample port that stops working when the broker does is not one anybody would
  # install. See docs/plans/01-native-mqtt.md.
  # ───────────────────────────────────────────────────────────────────────────
  sim-valve-mqtt:
    build: ./services/sim-valve-mqtt
    container_name: icc26-sim-valve-mqtt
    restart: unless-stopped
    environment:
      BROKER_HOST: ${VALVE_BROKER_HOST:-chariot}
      BROKER_PORT: ${VALVE_BROKER_PORT:-1883}
      MQTT_USERNAME: ${VALVE_MQTT_USERNAME:-sample-valve-01}
      MQTT_PASSWORD: ${VALVE_MQTT_PASSWORD:-sample-valve-01}
      DEVICE_ID: ${VALVE_DEVICE_ID:-sample-valve-01}
      CELL: ${VALVE_CELL:-br-201}
      # Factory defaults only. Whatever is saved on the config page wins and is
      # persisted to the named volume below, so changing these does nothing to a
      # device that has already been commissioned once.
      BASE_TOPIC: ${VALVE_BASE_TOPIC:-icc26/site1/upstream/br-201/sample-valve-01}
      PUBLISH_QOS: ${VALVE_PUBLISH_QOS:-1}
      PUBLISH_RETAIN: ${VALVE_PUBLISH_RETAIN:-true}
      BADGE_ROSTER: ${VALVE_BADGE_ROSTER:-B-1042:Jordan Reyes:qc-analyst:authorized,B-2087:Sam Okafor:maintenance:not-authorized}
      SAMPLE_WINDOW_S: ${VALVE_SAMPLE_WINDOW_S:-12}
      TELEMETRY_INTERVAL_S: ${VALVE_TELEMETRY_INTERVAL_S:-5}
      # Background badge traffic so the firehose is not empty between triggers.
      # Set to 0 for a scripted stage run where the only scan should be yours.
      SCAN_INTERVAL_S: ${VALVE_SCAN_INTERVAL_S:-90}
      LOG_LEVEL: ${VALVE_LOG_LEVEL:-INFO}
      TZ: ${TZ:-America/Chicago}
    ports:
      - "${VALVE_MQTT_UI_PORT:-8085}:8080"
    volumes:
      - valve-mqtt-config:/data
    # The config page answering is the whole liveness question: the MQTT client
    # reconnects on its own and the broker being down is this app's problem to
    # absorb, not a reason to call the container unhealthy.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Pattern 2 — the SAME smart sample valve assembly, Sparkplug B v3.0.0
  #
  # On BR-202's sample port, so both can run at once and be compared live.
  #
  # What the spec took away: the topic (derived from group/node/device), the QoS
  # and the retained flag. Its config page on 8086 still SHOWS all three — greyed
  # out, each labelled with the TCK clause that fixed it — because a device with
  # no QoS setting looks like one that forgot, and a device that shows you the
  # setting you may not touch is making a point.
  #
  # What it gave back: DBIRTH builds the consumer's tag tree by itself, every
  # metric carries its own datatype and engineering unit, `seq` makes a dropped
  # message detectable, and NDEATH is a death certificate every consumer already
  # knows how to read. Pattern 1 hand-rolls each of those, badly, on purpose.
  #
  # Still publish-only. The one inbound message honoured is Node Control/Rebirth,
  # which is not a valve command — it is the host asking the device to
  # re-announce itself, and Ignition's MQTT Engine sends it unprompted.
  # See docs/plans/02-sparkplug-b.md.
  # ───────────────────────────────────────────────────────────────────────────
  sim-valve-spb:
    build: ./services/sim-valve-spb
    container_name: icc26-sim-valve-spb
    restart: unless-stopped
    environment:
      BROKER_HOST: ${VALVE_BROKER_HOST:-chariot}
      BROKER_PORT: ${VALVE_BROKER_PORT:-1883}
      MQTT_USERNAME: ${VALVE_SPB_MQTT_USERNAME:-sample-valve-02}
      MQTT_PASSWORD: ${VALVE_SPB_MQTT_PASSWORD:-sample-valve-02}
      # The only three commissionable fields, and they are names inside a
      # namespace rather than the namespace itself. Same caveat as above: the
      # config page's saved value wins.
      GROUP_ID: ${VALVE_SPB_GROUP_ID:-ICC26-Site1-UPSTREAM}
      EDGE_NODE_ID: ${VALVE_SPB_EDGE_NODE_ID:-SAMPLE-VALVE-02}
      DEVICE_ID: ${VALVE_SPB_DEVICE_ID:-SV-202}
      CELL: ${VALVE_SPB_CELL:-br-202}
      # Name + alias at birth, alias alone in DATA — which is what Cirrus's own
      # Transmission does. Set false to put the names back on the wire and watch
      # the payload grow.
      USE_ALIASES: ${VALVE_SPB_USE_ALIASES:-true}
      BADGE_ROSTER: ${VALVE_BADGE_ROSTER:-B-1042:Jordan Reyes:qc-analyst:authorized,B-2087:Sam Okafor:maintenance:not-authorized}
      SAMPLE_WINDOW_S: ${VALVE_SAMPLE_WINDOW_S:-12}
      TELEMETRY_INTERVAL_S: ${VALVE_TELEMETRY_INTERVAL_S:-5}
      SCAN_INTERVAL_S: ${VALVE_SCAN_INTERVAL_S:-90}
      LOG_LEVEL: ${VALVE_SPB_LOG_LEVEL:-INFO}
      TZ: ${TZ:-America/Chicago}
    ports:
      - "${VALVE_SPB_UI_PORT:-8086}:8080"
    volumes:
      - valve-spb-config:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Pattern 4 — LIMS approval webhook
  #
  # Subscribes to icc26/site1/qc/analyzers/+/result as lims-bridge, holds the
  # sample unapproved, and on a human Approve POSTs it to Ignition through a
  # transactional outbox. Publishes nothing: publishTopics is empty, and
  # Transmission is the publisher. The approval screen is this container on
  # :8000, not Perspective — a LIMS screen should look like a LIMS.
  #
  # No depends_on: chariot. Reconnect-with-backoff is in-app, per the
  # conventions. The gateway certificate is mounted and trusted; we do not
  # disable TLS verification. See services/lims/README.md.
  # ───────────────────────────────────────────────────────────────────────────
  lims:
    build: ./services/lims
    container_name: icc26-lims
    restart: unless-stopped
    environment:
      BROKER_HOST: chariot
      MQTT_USERNAME: lims-bridge
      MQTT_PASSWORD: lims-bridge
      RESULT_TOPIC: icc26/site1/qc/analyzers/+/result
      PGHOST: postgres
      PGDATABASE: icc26
      PGUSER: icc26
      PGPASSWORD: ${ICC26_DB_PASSWORD:-icc26}
      # HTTPS. Ignition redirects :8088 to :8043, so HTTP is just an extra hop.
      # The mounted gateway cert is trusted; hostname check is off because the
      # restored ssl.pfx SAN is localhost, not `ignition`. See services/lims.
      WEBHOOK_URL: ${LIMS_WEBHOOK_URL:-https://ignition:8043/system/webdev/icc-2026/lims/sample-result}
      WEBHOOK_SECRET: ${LIMS_WEBHOOK_SECRET:-icc26-webhook-secret}
      WEBHOOK_MAX_ATTEMPTS: ${LIMS_WEBHOOK_MAX_ATTEMPTS:-5}
      WEBHOOK_CA_FILE: /certs/icc26-ignition.crt
      GENERATOR_INTERVAL_S: ${LIMS_GENERATOR_INTERVAL_S:-0}
      LOG_LEVEL: ${LIMS_LOG_LEVEL:-INFO}
      TZ: ${TZ:-America/Chicago}
    ports:
      - "${LIMS_PORT:-8000}:8000"
    volumes:
      - ./ignition/certificates/icc26-ignition.crt:/certs/icc26-ignition.crt:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Debezium Server — pattern 5. Tails bes.batch_event from the Postgres WAL as
  # user `cdc` and POSTs each change event to Ignition's cdc-sink WebDev
  # endpoint, which publishes it as mechanism=cdc through Transmission.
  #
  # It is deliberately the only service here with no relationship to the writer.
  # `bes_batch` writes rows through the ICC26 JDBC datasource as user `icc26` and
  # holds no broker credentials; this container holds no application credentials.
  # Stop it and the reactor keeps cycling with a silent topic — that is pattern
  # 5's failure demo, and it only works because the two halves are genuinely
  # unaware of each other.
  #
  # No depends_on: ignition. Debezium retries the sink, and the replication slot
  # holds the WAL position while the gateway is down.
  # ───────────────────────────────────────────────────────────────────────────
  debezium:
    image: quay.io/debezium/server:${DEBEZIUM_VERSION:-3.0.0.Final}
    container_name: icc26-debezium
    restart: unless-stopped
    # HTTPS on :8043, with the gateway certificate imported into a JKS at start.
    # Plain HTTP :8088 does not work and the failure is worth knowing: Ignition
    # 302s it to :8043, and Debezium's java.net.http.HttpClient defaults to
    # followRedirects(NEVER), so every event exhausts its retries on the redirect
    # and the connector dies with "Exceeded maximum number of attempts to publish
    # event" — a message naming neither the redirect nor the status code.
    #
    # Imported at container start rather than baked into an image on purpose:
    # `tasks.py seed` re-mints the gateway certificate, and a runtime import
    # always picks up the current one instead of needing a rebuild.
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/lib/jvm/java-21/bin/keytool -importcert -noprompt \
          -alias icc26-ignition -file /certs/icc26-ignition.crt \
          -keystore /tmp/ign.jks -storepass changeit >/dev/null \
          && echo "debezium: imported icc26-ignition.crt into /tmp/ign.jks" \
          || { echo "debezium: FAILED to import gateway cert"; exit 1; }
        exec /debezium/run.sh
    environment:
      # Interpolated into compose/debezium/application.properties at startup.
      CDC_SINK_URL: ${CDC_SINK_URL:-https://ignition:8043/system/webdev/icc-2026/cdc-sink?token=icc26-cdc-token}
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-cdc}
      # disableHostnameVerification is required, not laziness: `seed` restores the
      # existing ssl.pfx, whose SAN is `DNS:localhost, IP:127.0.0.1` — it does not
      # name `ignition`, which is the host Debezium dials. The signature is still
      # verified against the mounted cert in the truststore. Remint the keystore
      # to tighten this; the wider SAN list is already in tasks.py. The LIMS makes
      # exactly the same trade for exactly the same reason (services/lims/README).
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/tmp/ign.jks
        -Djavax.net.ssl.trustStorePassword=changeit
        -Djdk.internal.httpclient.disableHostnameVerification=true
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ./ignition/certificates/icc26-ignition.crt:/certs/icc26-ignition.crt:ro
      # /debezium/config, NOT /debezium/conf. The image's own failure message
      # says "check ... /debezium/conf/application.properties" and is simply
      # wrong: Quarkus scans /debezium/config, which is where the image keeps its
      # .example files. Mounted at conf/, the container starts, reads nothing,
      # and dies on a missing debezium.sink.type. Measured 2026-08-26.
      - ./compose/debezium:/debezium/config:ro
      # Offsets. Without a volume here the container forgets its WAL position on
      # restart and the "stop it, keep clicking, start it again" demo shows
      # nothing instead of catching up.
      - debezium-data:/debezium/data
    ports:
      # Quarkus serves its health endpoints on 8080 inside the container.
      - "${DEBEZIUM_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # Pattern 6 — a simulated MET ONE particle counter, GraphQL over HTTPS
  #
  # Nothing pushes. The instrument does not know Ignition exists; Ignition finds
  # out on a 30 s timer and walks a cursor. The honest consequence is a
  # detection gap — 10 s of sampling plus up to 30 s of waiting — and
  # characterizing it is the GxP hook, not apologizing for it.
  #
  # The API is transcribed from docs/reference/particle_counter_sim.md and gets
  # nothing added to it: no since_id, no excursion status, no location field, no
  # cursor reset. The awkwardness stays on our side, which is the same rule
  # pattern 3 keeps with the Nova's vendor address space.
  #
  # Spec:  docs/plans/06-poll-metone.md
  # ───────────────────────────────────────────────────────────────────────────
  sim-metone:
    build: ./services/sim-metone
    container_name: icc26-sim-metone
    restart: unless-stopped
    environment:
      # The sim says the site's name for itself, so nothing downstream has to
      # translate a serial number into a topic segment.
      DEVICE_ID: ${METONE_DEVICE_ID:-particle-counter-01}
      # Default sample point; the operator overrides it on :8089. The vendor
      # record has no location field, so this IS the location — see the spec.
      DEVICE_NAME: ${METONE_DEVICE_NAME:-USP Suite A - BR-201 sample port}
      # The vendor default is 60. Ten seconds is ours, and visibly ours: it is
      # a cadence an audience can watch. Every raw-count threshold in the system
      # means something only while this is 10 — 28.3 LPM for 10 s is 4.717 L.
      DURATION: ${METONE_DURATION:-10}
      CHANNELS: ${METONE_CHANNELS:-0.3,0.5,1,3,5,10}
      # Zero, not the vendor's 50. Nothing exists until somebody presses Start
      # on the touchscreen. Seeding history would put readings on the backbone
      # that nobody in the room saw the instrument take; the cost is that "press
      # Start" is a pre-show step that can be forgotten, which the panel's idle
      # banner and tasks.py health both guard.
      SEED_SAMPLES: ${METONE_SEED_SAMPLES:-0}
      LOG_LEVEL: ${METONE_LOG_LEVEL:-INFO}
      TZ: ${TZ:-America/Chicago}
    ports:
      - "${METONE_API_PORT:-8443}:8443"
      - "${METONE_PANEL_PORT:-8089}:8089"
    volumes:
      # Sample point + room condition + whether a run was going. NOT the sample
      # buffer: it regenerates from sequence number 1 on every restart, which is
      # what makes the stale-cursor failure demo work.
      - metone-config:/config
    # The panel is plain HTTP and is the cheap liveness probe. The GraphQL
    # endpoint is HTTPS with a self-signed cert generated at container start,
    # so probing it would mean shipping a curl -k into the image for no gain.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [icc26]

  # ───────────────────────────────────────────────────────────────────────────
  # (services/sim-vibration/ — the retired pattern-1 vibration gateway — was
  # deleted on 2026-08-23. It was never wired in here.)
  # ───────────────────────────────────────────────────────────────────────────

volumes:
  pgdata:
  ign-data:
  chariot-config:
  # What each valve was commissioned with, so a restart does not silently revert
  # the topic somebody set on stage. `tasks.py nuke` returns both to factory.
  valve-mqtt-config:
  valve-spb-config:
  # Debezium's WAL offsets. Survives a container restart on purpose; `nuke`
  # clears it, which is what you want after a `nuke` of pgdata — an offset
  # pointing into a WAL that no longer exists is worse than no offset.
  debezium-data:
  # Pattern 6's operator settings: the sample point, the room condition, and
  # whether a run was going. The sample buffer is deliberately NOT in here --
  # see the sim-metone service comment.
  metone-config:

networks:
  icc26:
    name: icc26
