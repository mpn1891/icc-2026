# ─────────────────────────────────────────────────────────────────────────────
# Debezium Server — pattern 5's out-of-band observer
#
# Tails bes.batch_event from the Postgres WAL as user `cdc` and POSTs each change
# event to Ignition's cdc-sink WebDev endpoint, which publishes it as
# mechanism=cdc -- an INSERT onto the batch event topic, an UPDATE or DELETE onto
# the audit topic with its pre-image. Nothing on the writing side asked for any
# of this: `bes_batch` writes a row through the ICC26 JDBC datasource as user
# `icc26` and has no broker credentials at all.
#
# Mounted read-only at **/debezium/config** — not /debezium/conf, whatever the
# image's own error message claims when it cannot find this file. Quarkus scans
# /debezium/config; a mount at conf/ starts cleanly, reads nothing, and dies on
# a missing debezium.sink.type. Measured 2026-08-26.
#
# ${VAR} references are resolved from the container environment, which compose
# fills from .env.
# ─────────────────────────────────────────────────────────────────────────────

# ── Sink ─────────────────────────────────────────────────────────────────────
# HTTPS on :8043. Plain :8088 does NOT work: Ignition 302s it to :8043 and
# Debezium's java.net.http.HttpClient defaults to followRedirects(NEVER), so
# every event exhausts its retries on the redirect and the connector dies with
# "Exceeded maximum number of attempts to publish event" — naming neither the
# redirect nor the status code. The truststore and the hostname-verification
# trade are set up in docker-compose.yml.
#
# The token rides in the query string rather than a header because Debezium
# Server's custom-header support is version-dependent, and a demo should not be
# one image bump away from silently losing its auth.
debezium.sink.type=http
debezium.sink.http.url=${CDC_SINK_URL}
debezium.sink.http.timeout.ms=5000
debezium.sink.http.retries=3
debezium.sink.http.retry.interval.ms=1000

# ── Source ───────────────────────────────────────────────────────────────────
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=cdc
debezium.source.database.password=${CDC_DB_PASSWORD}
debezium.source.database.dbname=icc26
debezium.source.topic.prefix=icc26

# `cdc` is deliberately not `icc26`. A distinct REPLICATION role is what makes
# this an observer the application knows nothing about, which is the sentence the
# talk track says out loud. compose/postgres/initdb/01-databases.sql.
debezium.source.plugin.name=pgoutput

# The publication is ours, created in initdb/04-cdc.sql, and names bes.batch_event
# only. `disabled` stops Debezium from helpfully creating a FOR ALL TABLES
# publication when it cannot find one — which would silently put every LIMS write
# onto the backbone under mechanism=cdc.
debezium.source.publication.name=icc26_cdc
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=icc26_debezium
debezium.source.table.include.list=bes.batch_event

# Do NOT let this default to `initial`. A snapshot replays every existing row as
# an insert on first connect, so a rehearsal's worth of batch history arrives on
# the topic in one burst the moment the container starts. `no_data` takes the
# schema and starts from the current LSN. (Older Debezium spells this `never`.)
debezium.source.snapshot.mode=no_data

# Offsets live on the debezium-data named volume. Without this the container
# forgets its position on restart, and the "stop Debezium, keep clicking, start it
# again" demo produces nothing instead of catching up — which is the one thing
# that demo exists to show.
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# ── Which operations reach the sink ──────────────────────────────────────────
# Inserts are batch events. Updates and deletes are somebody amending an
# append-only table, and they publish too, on a separate audit topic — see
# bes_cdc. Both are wanted, so the only operation skipped is `t` (truncate),
# which names no rows and so has nothing to say about a record.
#
# Set explicitly rather than left to the connector's default, which has moved
# between Debezium versions. An image bump should not quietly start or stop
# delivering an operation this demo makes a point of.
debezium.source.skipped.operations=t

# Tombstones are a Kafka log-compaction device: a second, null-valued message
# emitted after every delete. An HTTP sink has nothing to compact, and the null
# arrives at Ignition as an empty POST body. Off, so a delete is exactly one
# request. `bes_cdc.handle()` answers 200 to an empty body anyway, in case this
# ever drifts back — a 400 per delete in the gateway log would look like the sink
# was broken when it was only being told about Kafka.
debezium.source.tombstones.on.delete=false

# ── Format ───────────────────────────────────────────────────────────────────
# Schemas off: the sink wants the row, not a Connect schema envelope wrapped
# around it. No `unwrap` transform either, and that matters more than it used to
# — `unwrap` flattens an event down to its after image, which throws away `op`,
# `source.lsn` and, above all, `before`. Those three *are* the audit message an
# UPDATE or DELETE publishes; without them an amendment on the wire could say
# only that the row now reads this way, not what it used to say.
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false

# ── Logging ──────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."io.debezium".level=INFO
